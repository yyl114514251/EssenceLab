<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本质实验室 · 世界基石深度分析引擎</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23232B29'/%3E%3Ccircle cx='16' cy='11' r='5' fill='none' stroke='%23E8E0CE' stroke-width='2'/%3E%3Cpath d='M6 22h20' stroke='%23B08A3E' stroke-width='2'/%3E%3Cpath d='M10 27h12' stroke='%23A63D2B' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EFE6;
  --paper-2:#EAE3D2;
  --card:#F8F5EC;
  --ink:#232B29;
  --ink-2:#4A554F;
  --ink-3:#7A837D;
  --accent:#A63D2B;
  --accent-2:#C05A45;
  --copper:#B08A3E;
  --line:rgba(35,43,41,.16);
  --line-soft:rgba(35,43,41,.09);
  --shadow:0 1px 2px rgba(35,43,41,.06),0 6px 20px rgba(35,43,41,.05);
  --c-hard:#3E5C4B;
  --c-civ:#A67C2E;
  --c-mot:#A63D2B;
  --c-tool:#4A5A72;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
}
::selection{background:rgba(176,138,62,.28)}
a{color:inherit;text-decoration:none}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%}

/* ===== 布局骨架 ===== */
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

/* ===== 顶部导航 ===== */
.topnav{
  position:sticky;top:0;z-index:50;
  background:rgba(243,239,230,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
}
.topnav-inner{display:flex;align-items:center;gap:28px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.5px}
.brand-mark{width:30px;height:30px;flex:0 0 30px}
.brand-mark svg{display:block}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{
  padding:7px 14px;border-radius:7px;font-size:14px;color:var(--ink-2);
  transition:background .18s,color .18s;
}
.nav-links a:hover{background:var(--paper-2);color:var(--ink)}
.nav-links a.on{color:var(--accent);font-weight:600;background:rgba(166,61,43,.08)}
@media(max-width:640px){
  .topnav-inner{height:54px;gap:12px}
  .brand{font-size:15px}
  .nav-links a{padding:6px 9px;font-size:13px}
}

/* ===== Hero ===== */
.hero{
  padding:76px 0 44px;text-align:center;
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;left:50%;top:-160px;transform:translateX(-50%);
  width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,rgba(176,138,62,.10) 0%,rgba(176,138,62,.04) 42%,transparent 68%);
  pointer-events:none;
}
.hero-inner{position:relative}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;letter-spacing:3px;color:var(--copper);
  border:1px solid rgba(176,138,62,.4);border-radius:999px;
  padding:6px 16px;margin-bottom:26px;background:rgba(176,138,62,.06);
}
.hero h1{
  font-family:var(--serif);font-weight:900;font-size:52px;line-height:1.22;
  letter-spacing:2px;margin-bottom:18px;
}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{
  max-width:620px;margin:0 auto 10px;
  font-size:17px;color:var(--ink-2);font-weight:300;
}
.hero p.sub{font-size:14px;color:var(--ink-3);margin-bottom:38px}
@media(max-width:640px){
  .hero{padding:52px 0 32px}
  .hero h1{font-size:34px}
  .hero p.lead{font-size:15px}
}

/* ===== 分析框架示意（三层轴） ===== */
.axis{
  display:flex;align-items:stretch;justify-content:center;
  gap:0;margin:8px auto 0;max-width:860px;
}
.axis-step{
  flex:1;padding:20px 18px;text-align:left;position:relative;
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);
}
.axis-step + .axis-step{margin-left:22px}
.axis-arrow{
  position:absolute;right:-22px;top:50%;transform:translateY(-50%);
  width:22px;height:1px;background:var(--line);
}
.axis-arrow::after{
  content:"";position:absolute;right:0;top:-3px;
  border:4px solid transparent;border-left-color:var(--ink-3);border-right-width:0;
}
.axis-step:last-child .axis-arrow{display:none}
.axis-num{
  font-family:var(--serif);font-size:13px;color:var(--copper);
  letter-spacing:1px;margin-bottom:8px;display:block;
}
.axis-step h3{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:8px}
.axis-step p{font-size:13px;color:var(--ink-2);line-height:1.7}
@media(max-width:760px){
  .axis{flex-direction:column;gap:12px}
  .axis-step + .axis-step{margin-left:0}
  .axis-arrow{display:none}
}

/* ===== 章节标题 ===== */
.section{padding:52px 0 8px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px}
.section-title{
  font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:1px;
  display:flex;align-items:center;gap:14px;
}
.section-title::before{
  content:"";width:6px;height:26px;background:var(--accent);border-radius:3px;flex:0 0 6px;
}
.section-desc{font-size:14px;color:var(--ink-3)}

/* ===== 搜索/筛选 ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:26px}
.searchbox{
  flex:1;min-width:240px;position:relative;
}
.searchbox input{
  width:100%;padding:11px 16px 11px 40px;font-size:14px;
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);color:var(--ink);outline:none;
  font-family:var(--sans);transition:border .18s,box-shadow .18s;
}
.searchbox input:focus{border-color:var(--copper);box-shadow:0 0 0 3px rgba(176,138,62,.14)}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
  padding:8px 15px;font-size:13px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--card);
  transition:all .16s;
}
.filter-btn:hover{border-color:var(--copper);color:var(--ink)}
.filter-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count-hint{font-size:13px;color:var(--ink-3);margin-bottom:18px}

/* ===== 概念卡片网格 ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:40px}
.c-card{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:22px 20px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  display:flex;flex-direction:column;gap:10px;
}
.c-card:hover{transform:translateY(-3px);border-color:rgba(176,138,62,.55);box-shadow:var(--shadow)}
.c-card::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--cc,var(--copper));opacity:.85;
}
.c-card-head{display:flex;align-items:center;gap:10px;padding-left:4px}
.c-card-cat{
  font-size:11px;letter-spacing:1px;color:var(--cc,var(--copper));
  border:1px solid color-mix(in srgb,var(--cc,var(--copper)) 45%,transparent);
  padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--cc,var(--copper)) 8%,transparent);
}
.c-card-name{font-family:var(--serif);font-size:22px;font-weight:700;padding-left:4px}
.c-card-tag{font-size:13px;color:var(--ink-2);padding-left:4px;line-height:1.65;flex:1}
.c-card-meta{display:flex;align-items:center;justify-content:space-between;padding-left:4px;border-top:1px dashed var(--line-soft);padding-top:10px}
.c-card-meta span{font-size:12px;color:var(--ink-3)}
.c-card-meta b{font-size:12px;color:var(--accent);font-weight:600}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

/* ===== 空状态 ===== */
.empty{
  text-align:center;padding:70px 20px;color:var(--ink-3);
  border:1px dashed var(--line);border-radius:var(--r);grid-column:1/-1;
}
.empty b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink-2);margin-bottom:8px}

/* ===== 概念详情 ===== */
.detail-hero{padding:46px 0 6px}
.crumb{font-size:13px;color:var(--ink-3);margin-bottom:20px;display:flex;align-items:center;gap:6px}
.crumb a:hover{color:var(--accent)}
.detail-title-row{display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap}
.detail-badge{
  width:64px;height:64px;border-radius:14px;flex:0 0 64px;
  background:var(--cc,var(--copper));color:#FDFBF4;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:26px;font-weight:700;
}
.detail-titles{flex:1;min-width:260px}
.detail-cat{font-size:12px;letter-spacing:2px;color:var(--cc,var(--copper));margin-bottom:6px;display:block}
.detail-titles h1{font-family:var(--serif);font-size:40px;font-weight:900;letter-spacing:1px;line-height:1.25}
.detail-tag{font-size:16px;color:var(--ink-2);margin-top:8px;font-weight:300;max-width:640px;line-height:1.7}

/* 详情三栏 */
.detail-body{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:34px 0 10px}
.d-block{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:24px 22px;
}
.d-block-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.d-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.d-icon svg{width:18px;height:18px}
.d-block-head h2{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.5px}
.d-block-head .en{font-size:11px;color:var(--ink-3);letter-spacing:1.5px}
.d-list{display:flex;flex-direction:column;gap:16px}
.d-item{}
.d-item-title{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.d-item-title i{font-style:normal;color:var(--cc,var(--copper));font-family:var(--serif);font-size:13px}
.d-item p{font-size:13.5px;color:var(--ink-2);line-height:1.72}
.myth-item{display:flex;gap:10px;align-items:flex-start}
.myth-x{
  flex:0 0 20px;width:20px;height:20px;border-radius:50%;margin-top:2px;
  background:rgba(166,61,43,.1);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
.insight-item{display:flex;gap:10px;align-items:flex-start}
.insight-bullet{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--cc,var(--copper));margin-top:9px}
@media(max-width:900px){.detail-body{grid-template-columns:1fr}}

/* 关联概念 */
.related{padding:10px 0 50px}
.related h2{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.related h2::before{content:"";width:5px;height:20px;background:var(--copper);border-radius:3px}
.rel-chips{display:flex;flex-wrap:wrap;gap:10px}
.rel-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:14px;transition:all .16s;
}
.rel-chip:hover{border-color:var(--copper);transform:translateY(-2px)}
.rel-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cc,var(--copper))}
.rel-chip small{color:var(--ink-3);font-size:12px}

/* ===== 关系网络 ===== */
.net-wrap{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;margin:0 0 44px}
#netChart{width:100%;height:600px}
.net-legend{display:flex;flex-wrap:wrap;gap:18px;padding:6px 10px 14px;border-bottom:1px solid var(--line-soft);margin-bottom:10px;font-size:12.5px;color:var(--ink-2)}
.net-legend .lg{display:flex;align-items:center;gap:7px}
.net-legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.net-tip{font-size:12.5px;color:var(--ink-3);padding:10px 10px 0;line-height:1.7}
@media(max-width:640px){#netChart{height:460px}}

/* ===== 深度分析器 ===== */
.analyzer-hero{padding:46px 0 26px;text-align:center}
.analyzer-hero h1{font-family:var(--serif);font-size:36px;font-weight:900;letter-spacing:1px}
.analyzer-hero p{color:var(--ink-2);font-size:15px;max-width:600px;margin:12px auto 0;font-weight:300}
.ana-input{
  max-width:640px;margin:26px auto 0;display:flex;gap:10px;flex-wrap:wrap;
}
.ana-input input{
  flex:1;min-width:220px;padding:14px 18px;font-size:16px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  font-family:var(--serif);color:var(--ink);outline:none;
  transition:border .18s,box-shadow .18s;
}
.ana-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(166,61,43,.12)}
.ana-go{
  padding:14px 30px;border-radius:var(--r);background:var(--ink);color:var(--paper);
  font-size:15px;font-weight:600;letter-spacing:1px;transition:background .18s,transform .15s;
}
.ana-go:hover{background:var(--accent);transform:translateY(-1px)}
.ana-suggest{margin-top:16px;font-size:13px;color:var(--ink-3)}
.ana-suggest button{color:var(--copper);border-bottom:1px dashed rgba(176,138,62,.6);margin:0 2px;font-size:13px;padding:2px 4px}
.ana-suggest button:hover{color:var(--accent)}
.ana-note{
  margin:22px auto 0;max-width:640px;font-size:12.5px;color:var(--ink-3);
  border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px;text-align:left;line-height:1.7;
}
/* 分析结果 */
.ana-result{max-width:900px;margin:10px auto 0;padding-bottom:50px;display:none}
.ana-result.show{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ana-q-title{
  font-family:var(--serif);font-size:21px;font-weight:700;margin:30px 0 4px;
  display:flex;align-items:center;gap:12px;
}
.ana-q-title::before{content:"";width:5px;height:21px;background:var(--accent);border-radius:3px}
.ana-q-sub{font-size:13px;color:var(--ink-3);margin-bottom:16px}
.ana-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:760px){.ana-grid{grid-template-columns:1fr}}
.ana-cell{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px}
.ana-cell h4{font-size:14.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ana-cell h4 .qnum{
  width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--paper);
  font-size:12px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);
}
.ana-cell p{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.ana-cell .eg{
  margin-top:10px;font-size:12px;color:var(--copper);border-top:1px dashed var(--line-soft);padding-top:9px;
}
.ana-cell .eg b{color:var(--accent);font-weight:600}

/* ===== 页脚 ===== */
.footer{border-top:1px solid var(--line-soft);padding:34px 0 44px;text-align:center;color:var(--ink-3);font-size:13px}
.footer .f-brand{font-family:var(--serif);font-size:16px;color:var(--ink-2);font-weight:700;margin-bottom:8px;letter-spacing:1px}
.footer p{line-height:1.9}

/* 通用 */
.hidden{display:none!important}
.back-top{
  position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:50%;
  background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;
}
.back-top.show{opacity:1;pointer-events:auto}
.back-top:hover{background:var(--accent)}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="topnav">
  <div class="wrap topnav-inner">

      <span class="brand-mark">
        <svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="#232B29"/><circle cx="15" cy="10.5" r="4.5" fill="none" stroke="#E8E0CE" stroke-width="1.8"/><path d="M5.5 20.5h19" stroke="#B08A3E" stroke-width="1.8"/><path d="M9.5 25h11" stroke="#A63D2B" stroke-width="1.8"/></svg>
      </span>
      本质实验室
    </a>
    <nav class="nav-links">
      <a href="#/" data-nav="home" data-route>概念库</a>
      <a href="#/network" data-nav="network" data-route>关系网络</a>
      <a href="#/analyze" data-nav="analyze" data-route>深度分析器</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="footer">
  <div class="wrap">
    <div class="f-brand">本质实验室 · Essence Lab</div>
    <p>一套用于剖析「世界基本性事物」的深度分析引擎：本质 · 价值 · 现实映射。<br>内容为结构化思辨产物，供参考与启发，不构成任何专业建议。</p>
  </div>
</footer>

<button class="back-top" id="backTop" aria-label="回到顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
</button>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
/* ============================================================
 * 数据层：世界基石概念库
 * ============================================================ */
const CATS = {
  hard:  { name:"硬基石",  desc:"世界的物理底座，一切存在的前提", color:"#3E5C4B" },
  civ:   { name:"文明基石", desc:"让人类可以协作、积累与创造的结构", color:"#A67C2E" },
  mot:   { name:"动机基石", desc:"驱动人行动与选择的内在力量", color:"#A63D2B" },
  tool:  { name:"派生工具", desc:"由基石演化出的杠杆与载体", color:"#4A5A72" }
};

const CONCEPTS = [
{
  id:"matter", name:"物质", cat:"hard",
  tag:"一切存在与财富的实体基底，抽象价值的最终载体",
  essence:[
    {t:"第一性", p:"宇宙中可感知、有质量、占据空间的一切。无论文明如何数字化，食物、建筑、芯片、服务器、你的身体，全部由物质构成。"},
    {t:"机制", p:"物质守恒且不可凭空创造，只能被采集、加工、重组。价值链条的起点永远是物质：矿石变成金属，金属变成设备，设备产出服务。"},
    {t:"边界", p:"物质的稀缺性与分布不均，决定了资源冲突、供应链风险与财富的地理分布。谁掌握关键物质（稀土、锂、晶圆），谁就掌握产业链咽喉。"}
  ],

/* ---------- 工具 ---------- */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function catColor(id){ return CATS[id].color; }
function catName(id){ return CATS[id].name; }
function byId(id){ return CONCEPTS.find(c=>c.id===id); }
function relFor(id){
  return RELATIONS.filter(r=>r.src===id||r.dst===id)
    .map(r=>({ other: r.src===id?r.dst:r.src, type:r.type, note:r.note }));
}

function viewNetwork(){
  app.innerHTML = `
  <section class="section" style="padding-top:44px">

        <h2 class="section-title">基石关系网络</h2>

      </div>
      <div class="net-wrap">
        <div class="net-legend">
          ${Object.entries(CATS).map(([k,v])=>`<span class="lg"><span class="sw" style="background:${v.color}"></span>${v.name}</span>`).join('')}
          <span class="lg" style="margin-left:auto">节点大小 = 关联数量 · 点击节点查看详情</span>
        </div>
        <div id="netChart"></div>
        <p class="net-tip">这张图展示的是基石之间的深层结构：信任是货币的母体，知识由信息转化而来，技术是知识的可执行化，自由与金钱相互支撑、又被规则界定边界。理解这些连接，比孤立地记住每个概念更有用。</p>
      </div>
    </div>
  </section>`;

  const el = document.getElementById('netChart');
  if(netChart){ netChart.dispose(); }
  netChart = echarts.init(el);

  /* 环形布局：按分类分区，确定性渲染 */
  const catOrder = ['hard','civ','mot','tool'];
  const perCat = 2 * Math.PI / catOrder.length;
  const R = 235;
  const posMap = {};
  catOrder.forEach((cat,ci)=>{
    const list = CONCEPTS.filter(c=>c.cat===cat);
    list.forEach((c,li)=>{
      const startAngle = -Math.PI/2 + ci*perCat;
      const angle = startAngle + (li + 0.5) * (perCat / list.length);
      posMap[c.id] = { x: Math.cos(angle)*R, y: Math.sin(angle)*R };
    });
  });

  const nodes = CONCEPTS.map(c=>{
    const deg = RELATIONS.filter(r=>r.src===c.id||r.dst===c.id).length;
    return {
      id:c.id, name:c.name, value:deg,
      x:posMap[c.id].x, y:posMap[c.id].y,
      symbolSize: 26 + deg*5,
      itemStyle:{ color:catColor(c.cat) },
      category:catOrder.indexOf(c.cat),
      label:{ show:true, fontSize:13, color:'#232B29', fontFamily:'"Noto Serif SC",serif', fontWeight:600 }
    };
  });
  const links = RELATIONS.map(r=>({ source:r.src, target:r.dst, value:r.type }));

  netChart.setOption({
    tooltip:{
      trigger:'item',
      backgroundColor:'#232B29', borderWidth:0,
      textStyle:{ color:'#F3EFE6', fontSize:12.5 },
      formatter: p=>{
        if(p.dataType==='edge'){
          const l = RELATIONS.find(r=>(r.src===p.data.source && r.dst===p.data.target)||(r.src===p.data.target && r.dst===p.data.source));
          return `<b>${esc(byId(p.data.source).name)} → ${esc(byId(p.data.target).name)}</b><br>${esc(l.type)}：${esc(l.note)}`;
        }
        const c = byId(p.data.id);
        return `<b style="font-size:14px">${esc(c.name)}</b><br><span style="color:#B08A3E">${catName(c.cat)}</span><br>${esc(c.tag)}<br><span style="color:#B08A3E">点击查看深度分析</span>`;
      }
    },
    legend:{
      data:Object.entries(CATS).map(([k,v])=>v.name),
      icon:'circle', itemWidth:9, itemHeight:9,
      textStyle:{ color:'#4A554F', fontSize:12 },
      top:0
    },
    series:[{
      type:'graph', layout:'none',
      roam:true, draggable:true, data:nodes, links,
      categories:Object.entries(CATS).map(([k,v])=>({ name:v.name })),
      lineStyle:{ color:'source', curveness:0.08, width:1.4, opacity:0.55 },
      emphasis:{ focus:'adjacency', lineStyle:{ width:2.6, opacity:0.9 }, label:{ fontSize:15 } },
      edgeSymbol:['none','arrow'], edgeSymbolSize:6,
      labelLayout:{ hideOverlap:true }
    }]
  });
  netChart.on('click', p=>{ if(p.dataType!=='edge' && p.data.id) location.hash = '#/concept/'+p.data.id; });
}

/* ---------- 视图：深度分析器 ---------- */
const SUGGESTIONS = ['机会','内卷','幸福','自由','品牌','算法','信任','复利','风口','焦虑','创造力','孤独'];

function viewAnalyze(initQ){
  app.innerHTML = `
  <section class="analyzer-hero">
    <div class="wrap">
      <h1>深度分析器</h1>
      <p>输入任何概念，本引擎将沿着「本质 → 价值 → 现实映射」的框架，生成一套结构化的分析引导与思考路径。你无需成为哲学家，也能把一件事想得足够深。</p>
      <div class="ana-input">
        <input id="anaIn" type="text" placeholder="输入一个概念，例如：机会" autocomplete="off" maxlength="24">
        <button class="ana-go" id="anaGo">开始分析</button>
      </div>
      <div class="ana-suggest">试试：${SUGGESTIONS.map(s=>`<button data-s="${s}">${s}</button>`).join('')}</div>
      <div class="ana-note">说明：深度分析器提供的是「分析框架与引导问题」，用于激发你自己的思考——真正深刻的理解，需要你把框架套用到具体场景中完成。框架灵感源自本库 18 个基石的分析方法。</div>
    </div>
  </section>
  <section class="ana-result wrap" id="anaResult"></section>`;

  const inp = document.getElementById('anaIn');
  const go  = document.getElementById('anaGo');
  const res = document.getElementById('anaResult');

  function run(){
    const q = inp.value.trim();
    if(!q){ inp.focus(); return; }
    const qe = esc(q);
    const hasConcept = CONCEPTS.find(c=>c.name===q);
    const ref = hasConcept;
    const refHTML = ref
      ? `<div class="ana-cell" style="grid-column:1/-1;border-color:rgba(176,138,62,.4);background:rgba(176,138,62,.05)">
          <h4><span class="qnum">☆</span>已收录基石</h4>
          <p>「${esc(ref.name)}」已在概念库中收录。点击查看完整的深度分析：</p>
          <p class="eg"><a href="#/concept/${ref.id}" style="color:var(--accent);font-weight:600;border-bottom:1px solid var(--accent)">打开「${esc(ref.name)}」完整分析 →</a></p>
        </div>` : '';

    res.innerHTML = `
      <div class="ana-q-title">第一步 · 追问本质</div>
      <div class="ana-q-sub">回答以下问题，界定「${qe}」到底是什么。</div>
      <div class="ana-grid">
        <div class="ana-cell"><h4><span class="qnum">1</span>它是什么？</h4><p>用一句话定义「${qe}」，再追问：这个定义是否经得起反例？</p><p class="eg"><b>示例</b>（以「钱」为例）：钱是社会共同承认的劳动欠条，而非财富本身。</p></div>
        <div class="ana-cell"><h4><span class="qnum">2</span>它不是什么？</h4><p>列出它与容易混淆事物的边界：它不是 X，不是 Y。边界越清晰，本质越明确。</p><p class="eg"><b>示例</b>：钱不是财富（财富是生产与物质），钱只是兑换凭证。</p></div>
        <div class="ana-cell"><h4><span class="qnum">3</span>它由什么构成？</h4><p>拆解「${qe}」的组成要素：它的原料、前提、底层机制各是什么？</p><p class="eg"><b>示例</b>：信任 = 长期一致的行为 + 制度背书 + 声誉信号。</p></div>
        <div class="ana-cell"><h4><span class="qnum">4</span>它依赖什么存在？</h4><p>如果某个支撑消失，「${qe}」还成立吗？这能暴露它的真实根基。</p><p class="eg"><b>示例</b>：货币依赖国家信用与生产力，信用崩塌则货币贬值。</p></div>
      </div>

      <div class="ana-q-title">第二步 · 拆解价值</div>
      <div class="ana-q-sub">理解「${qe}」为什么重要、为谁创造价值。</div>
      <div class="ana-grid">
        <div class="ana-cell"><h4><span class="qnum">1</span>对谁有价值？</h4><p>列出「${qe}」的直接受益者与间接受益者，谁最依赖它？</p><p class="eg"><b>示例</b>：信任对交易双方、平台、社会整体都有价值。</p></div>
        <div class="ana-cell"><h4><span class="qnum">2</span>价值从哪里来？</h4><p>它解决什么问题、满足什么需求？价值不是天然的，而是相对问题的。</p><p class="eg"><b>示例</b>：时间的价值来自稀缺与不可逆——它让选择产生机会成本。</p></div>
        <div class="ana-cell"><h4><span class="qnum">3</span>失去它会怎样？</h4><p>反向推演：如果「${qe}」消失或稀缺，什么会崩溃？崩溃面就是价值面。</p><p class="eg"><b>示例</b>：失去信任，交易成本暴涨，市场退化为熟人社会。</p></div>
        <div class="ana-cell"><h4><span class="qnum">4</span>它能被替代吗？</h4><p>寻找「${qe}」的替代品：替代成本越高，价值越稳固。</p><p class="eg"><b>示例</b>：效率工具可部分替代时间，但不可完全替代——时间是终局资源。</p></div>
      </div>

      <div class="ana-q-title">第三步 · 现实映射</div>
      <div class="ana-q-sub">把「${qe}」放回真实世界：它在哪运转、谁靠它赚钱、坑在哪里。</div>
      <div class="ana-grid">
        <div class="ana-cell"><h4><span class="qnum">1</span>在现实中哪里体现？</h4><p>列举「${qe}」在生活、产业、社会中的具体载体与现象。</p><p class="eg"><b>示例</b>：信任体现在品牌溢价、征信体系、平台担保中。</p></div>
        <div class="ana-cell"><h4><span class="qnum">2</span>谁在靠它赚钱？</h4><p>找到把「${qe}」商品化、服务化的商业模式——那里通常是风口。</p><p class="eg"><b>示例</b>：信息差（资讯、中介、教育）、时间（节省时间的工具）、信任（担保、认证）。</p></div>
        <div class="ana-cell"><h4><span class="qnum">3</span>它如何被交易？</h4><p>「${qe}」的定价机制是什么？谁定价、按什么定价、是否有市场？</p><p class="eg"><b>示例</b>：注意力被广告市场定价，按曝光与转化计费。</p></div>
        <div class="ana-cell"><h4><span class="qnum">4</span>坑与误区在哪？</h4><p>关于「${qe}」最常见的误解是什么？盲目跟风的风险是什么？</p><p class="eg"><b>示例</b>：把「信息多」当「知识多」，把「涨薪」当「财富积累」。</p></div>
      </div>

      <div class="ana-q-title">第四步 · 收束与行动</div>
      <div class="ana-q-sub">把分析落回自己身上，形成可执行判断。</div>
      <div class="ana-grid">
        <div class="ana-cell"><h4><span class="qnum">1</span>一句话本质</h4><p>把前三步压缩成一句话：「${qe}」在本质上是什么？</p><p class="eg"><b>示例</b>：机会 = 变化 × 刚需 × 你的差异化能力。</p></div>
        <div class="ana-cell"><h4><span class="qnum">2</span>与我相关吗</h4><p>「${qe}」与我的职业、资产、关系、成长有怎样的连接点？重要级如何？</p><p class="eg"><b>示例</b>：对工程师，「时间」意味着用系统与工具把自己从重复劳动中释放。</p></div>
        <div class="ana-cell"><h4><span class="qnum">3</span>最小行动</h4><p>基于以上分析，本周可以做的、最小的一个行动是什么？</p><p class="eg"><b>示例</b>：如果分析出「信任」重要，就去完成一次高质量交付并请对方反馈。</p></div>
        <div class="ana-cell"><h4><span class="qnum">4</span>验证标准</h4><p>用什么指标判断你对「${qe}」的理解是对的？设定一个可观测的验证点。</p><p class="eg"><b>示例</b>：能否用一句话向别人讲清楚它，且对方能复述出要点。</p></div>
      </div>
      ${refHTML}
    `;
    res.classList.add('show');
    res.scrollIntoView({behavior:'smooth', block:'start'});
  }

  go.addEventListener('click', run);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  document.querySelectorAll('.ana-suggest button').forEach(b=>{
    b.addEventListener('click', ()=>{ inp.value = b.dataset.s; run(); });
  });
  if(initQ){ inp.value = initQ; run(); }
}

/* ---------- 路由 ---------- */
function route(){
  const hash = location.hash || '#/';
  const navs = document.querySelectorAll('.nav-links a');
  navs.forEach(a=>a.classList.toggle('on', a.getAttribute('href')===hash));

  if(hash.startsWith('#/concept/')){
    viewConcept(decodeURIComponent(hash.slice(10)));
  } else if(hash==='#/network'){
    viewNetwork();
  } else if(hash.startsWith('#/analyze')){
    let initQ = '';
    const qi = hash.indexOf('?q=');
    if(qi!==-1) initQ = decodeURIComponent(hash.slice(qi+3));
    viewAnalyze(initQ);
  } else {
    viewHome();
  }
  window.scrollTo({top:0, behavior:'instant'});
}

window.addEventListener('hashchange', route);
window.addEventListener('resize', ()=>{ if(netChart) netChart.resize(); });
document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-route]');
  if(a){ e.preventDefault(); location.hash = a.getAttribute('href'); }
});

/* ---------- 返回顶部 ---------- */
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', ()=>{
  backTop.classList.toggle('show', window.scrollY > 600);
});
backTop.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));

route();
</script>
